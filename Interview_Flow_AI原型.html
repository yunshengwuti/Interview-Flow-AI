/* V20 visual system — NetEase-inspired soft white & coral, dimensions and interaction untouched */
body{background:#f7f7fa;color:var(--ink)}
.card,.panel,.metric,.batch-card,.modal{background:#fff;border-color:#e9ebf0;box-shadow:0 7px 24px rgba(43,50,69,.045)}
.agent{background:#f9f9fb;border-color:#e5e8ee;box-shadow:0 24px 65px rgba(46,53,75,.19)}
.agent-head{border-bottom-color:#edf0f3}
.brand-icon,.agent-symbol{background:linear-gradient(150deg,#ff847a,#e95f59);box-shadow:0 5px 14px rgba(233,101,95,.16)}
.launcher{background:#fff;color:#d95450;border:1px solid #f4d8d5;box-shadow:0 12px 36px rgba(74,63,68,.18)}
.launcher:hover{background:#fff6f5}
.btn.primary{background:#ed6a63;border-color:#ed6a63;color:white;box-shadow:0 4px 12px rgba(233,99,91,.14)}
.btn.primary:hover{background:#df5b55;border-color:#df5b55}
.btn:hover{background:#fff7f6}
.btn.danger{color:#d85e59}
.nav-only{background:#fff1ef;color:#d65d56}
.brand{color:#2d313a}
.avatar{background:#fff1ef;color:#d65d56}
.pool th{background:#fafafb;color:#818996}
.pool td,.person,.task,.kv{border-color:#edf0f3}
.pool .count,.muted,.plan-grid span{color:#8a929f}
.filters input,.filters select,.field input,.field select,.field textarea{border-color:#e3e7ee;color:#38404a}
.filters input:focus,.filters select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#ef9b96}
.batch-card{border-color:#ecedf1;box-shadow:0 7px 22px rgba(51,54,70,.06)}
.batch-card:hover,.batch-card:focus-visible{border-color:#f2bbb7;box-shadow:0 16px 32px rgba(58,48,53,.11)}
.batch-card .job,.batch-card .date{color:#828e9d}
.metric span,.metric b{color:#343944}
.tag{background:#fff2f0;border-color:#f8dcd8;color:#d9635b}
/* Status colors stay semantic, not all-red */
.tag.wait{background:#f4f5f7;border-color:#e6e8ec;color:#88919e}
.tag.green{background:#eaf6ee;border-color:#d3e8da;color:#327b5a}
.tag.red{background:#fff0f0;border-color:#f2d9d8;color:#d15c58}
.tag.amber{background:#fff6eb;border-color:#f1e4d0;color:#a57d4c}
.todo-count,.count-bubble{background:#ee6964}
.task-icon,.check{background:#fff0ef;color:#e26860}
.task:hover{background:#fff8f7}
.agent-controls button:hover{background:#fff2f0}
.agent-controls button,.modal-close{color:#8e949e}
.back{border-color:#e7e8ed;color:#dc625c}
.notice,.hint,.email,.slot-box{background:#fafafb;border-color:#eaecf0;color:#747d89}
.veil{background:rgba(26,30,40,.40)}
.toast{bottom:45px;max-width:calc(100vw - 32px);background:#fff;color:#272c35;border:1px solid #e5e8ed;border-radius:0;box-shadow:0 6px 20px rgba(36,37,43,.1)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline-color:#ed8981}

/* Detail information architecture */
.detail-shell{position:relative;overflow:hidden}.detail-tabs{grid-template-columns:1fr 1fr}.detail-tabs button{position:relative}.tab-red-dot{position:absolute;right:8px;top:4px;width:9px;height:9px;border-radius:50%;background:#e65d64;box-shadow:0 0 0 3px white}.plan-heading-label{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.plan-heading-label .panel-round{margin:0!important}.plan-edit{font-size:11px;white-space:nowrap;padding:8px 10px}.backfill-summary{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.backfill-summary strong{font-size:30px;color:var(--ink)}.history-handle{position:absolute;right:0;bottom:22px;z-index:2;border:1px solid var(--line);background:#fff;border-radius:10px 0 0 10px;padding:11px 8px;color:var(--ink);box-shadow:0 5px 15px #27324714;cursor:pointer;writing-mode:vertical-rl}.history-overlay{position:absolute;inset:0;background:#26334a30;z-index:5}.history-drawer{position:absolute;right:0;top:0;bottom:0;width:40%;z-index:6;background:#fff;padding:22px;overflow-y:auto;box-shadow:-15px 0 35px #1e2c4328;border-left:1px solid var(--line)}

/* 补位管理：与原型草图一致的全选和时段胶囊卡 */
.backfill-pane{gap:15px}
.backfill-note{font-size:12px;color:#858d9c;margin:0}
.backfill-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;color:#657080}
.backfill-metrics strong{font-size:19px;color:#253348;margin-left:4px}
.backfill-select-heading{display:flex;align-items:center;gap:16px;justify-content:flex-start;font-size:14px}
.select-all{display:flex;align-items:center;gap:7px;font-size:12px;color:#657080;cursor:pointer}
.select-all input,.backfill-slot input{accent-color:#eb6863;width:16px;height:16px;cursor:pointer}
.backfill-slot-cards{display:flex;gap:10px;flex-wrap:wrap;min-height:50px;align-content:flex-start}
.backfill-slot{border:1px solid #dfe3ea;border-radius:12px;padding:9px 12px;background:white;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#364357}
.backfill-slot.selected{background:#fff4f3;border-color:#e47f7b}
.backfill-slot.unavailable{opacity:.55;cursor:not-allowed}
.backfill-slot small{font-size:10px;color:#8490a0}
.backfill-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto}
.backfill-foot .btn{min-width:115px}
.person-dialog{width:min(560px,100%)}.person-contact{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:12px;flex-wrap:wrap}.person-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.inline-status{display:flex;align-items:center;gap:6px}.inline-status select{border:1px solid #eed8d4;background:#fff7f5;width:29px;min-width:29px;height:28px;color:#bf625b;appearance:auto;padding:2px;cursor:pointer;border-radius:8px;font-size:13px}.person-modes{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;font-size:12px}.person-modes label{display:flex;align-items:center;gap:5px}.choice-slot{cursor:pointer;border-radius:9px}.choice-slot.selected{background:#fff0ef;border-color:#f16b63;color:#d95049;box-shadow:0 0 0 1px #f16b63 inset}.person-meta-grid .field b{font-size:13px}

.polished-person{border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(35,44,62,.17);max-height:90vh;overflow-y:auto}
.polished-person .modal-top{padding-bottom:16px;border-bottom:1px solid #edf0f4;margin-bottom:17px}

 const overlay=document.createElement('div');overlay.id='trashClearConfirm';overlay.className='veil decision-confirm-veil';
 overlay.innerHTML=`<section class="modal decision-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="trashClearTitle" aria-describedby="trashClearText"><h2 id="trashClearTitle">清空回收站？</h2><p id="trashClearText">将永久删除这 ${batches.length} 个任务，清空后无法还原。</p><div class="modal-actions"><button type="button" class="btn small" data-action="cancel">取消</button><button type="button" class="btn small primary" data-action="confirm">确定清空</button></div></section>`;
 const wasInert=dialog.inert,previousFocus=document.activeElement;dialog.inert=true;$('agent').appendChild(overlay);

}

 overlay.innerHTML=`<section class="modal decision-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="decisionConfirmTitle" aria-describedby="decisionConfirmText"><h2 id="decisionConfirmTitle">${esc(title)}</h2><p id="decisionConfirmText">确认后，候选人状态将自动更新为「${esc(status)}」。</p><div class="modal-actions"><button type="button" class="btn small" data-action="cancel">返回修改</button><button type="button" class="btn small primary" data-action="confirm">确认</button></div></section>`;
 const previousFocus=document.activeElement;
 const dismiss=()=>leaveDialog(overlay,()=>{overlay.remove();previousFocus?.focus()});
 overlay.querySelector('[data-action="cancel"]').onclick=dismiss;
 overlay.querySelector('[data-action="confirm"]').onclick=()=>leaveDialog(overlay,()=>{overlay.remove();onConfirm()});
 overlay.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();dismiss()}if(event.key==='Tab'){const buttons=[...overlay.querySelectorAll('button')];event.preventDefault();buttons[document.activeElement===buttons[0]?1:0].focus()}});
 $('agent').appendChild(overlay);enterSurface(overlay,'veil');enterSurface(overlay.querySelector('.modal'),'dialog');overlay.querySelector('[data-action="confirm"]').focus();
}
function savePerson(e,i,taskId,confirmed=false){
 e.preventDefault();const b=current(),p=b.people[i],x=Object.fromEntries(new FormData(e.target));
 const original=p[3],chosen=x.slot!==''&&x.slot!==undefined,decision=x.decision;
 if(decision==='adjust'&&!chosen){toast('请先选择一个当前空缺时段');return}
 if(decision==='original'&&!Number.isInteger(original)){toast('原面试时段不存在，无法确认');return}
 if(decision==='adjust'&&!availableSlots(b).includes(Number(x.slot))){toast('所选时段已被占用或不可用，请重新选择');return}
 const nextStatus={adjust:'已确认',original:'已确认',next:'改期',reject:'已放弃'}[decision];
 if(!nextStatus){toast('请选择处理结果');return}
 if(!confirmed){showPersonDecisionConfirm(nextStatus,()=>savePerson(e,i,taskId,true));return}
 const hadActiveSlot=Number.isInteger(original)&&!['改期','已放弃'].includes(p[2]);
 recordSlotRelease(b,p,nextStatus,decision==='adjust'?Number(x.slot):p[3]);
 if(decision==='adjust'){p[3]=Number(x.slot);p[2]='已确认'}
 else if(decision==='original'){p[2]='已确认'}
 else if(decision==='next'){p[2]='改期'}
 else if(decision==='reject'){p[2]='已放弃'}
 else {toast('请选择处理结果');return}
 p[4]='';
 if(taskId)b.todos=b.todos.filter(t=>t[0]!==taskId);
 const labels={adjust:'调整至当前空缺时段',original:'确认原面试时间',next:'转入后续面试批次',reject:'候选人放弃面试'};
 prependBatchLogs(b,`Agent 执行 ${p[0]}：状态更新为${p[2]}${decision==='adjust'?`，面试时段 ${Number.isInteger(original)?timeAt(b,original):'未分配'} → ${timeAt(b,p[3])}`:''}${['next','reject'].includes(decision)&&Number.isInteger(original)?hadActiveSlot?'，原时段释放':'，原时段已释放':''}`,`HR 处理 ${p[0]}：${labels[decision]}`);
 if(state.view==='todo')returnFromTodoPage();else{closeModal();render()}renderPool();
}
function backfillModal(){let b=current(),released=vacatedSlots(b).filter(i=>slotStart(b,i).getTime()-Date.now()>BACKFILL_CUTOFF_HOURS*3600000),selected=selectedSlotsFor(b,released),limit=Math.min(selected.length,eligibleCandidates(b).length);return `<div class="veil" onclick="if(event.target===this)closeModal()"><section class="modal backfill-confirm-modal" role="dialog" aria-modal="true" aria-label="${b.todos.length?'待办未完成，仍要补位？':'补位确认'}"><div class="modal-top"><div><h2>${b.todos.length?'待办未完成，仍要补位？':'补位邀请 · HR 确认'}</h2><div class="muted small">${esc(b.round)} · ${dateLabel(b.date)} ${Number(b.time.split(':')[0])<12?'上午':'下午'}</div></div><button class="modal-close" onclick="closeModal()">×</button></div>${b.todos.length?`<p class="modal-help backfill-pending-warning" role="alert">继续补位可能与待处理的安排冲突。</p>`:''}<p class="modal-help"><span class="backfill-hint-star" aria-hidden="true">*</span> 确认后 Agent 按 FIFO 为所选时段发送邀请</p><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="button" class="btn primary" ${!selected.length||limit!==selected.length?'disabled':''} onclick="confirmBackfill()">确定</button></div></section></div>`}
async function confirmBackfill(){
 const b=current();if(!b||isBackfillSending(b.id))return false;
 if(!canBackfill(b,true)){toast('补位条件已变化，请重新检查');closeModal();render();return false}
 const slots=vacatedSlots(b).filter(i=>slotStart(b,i).getTime()-Date.now()>BACKFILL_CUTOFF_HOURS*3600000),chosen=selectedSlotsFor(b,slots),candidates=eligibleCandidates(b);
 if(!chosen.length||chosen.length>candidates.length){toast('请选择有效时段，且人数不能超过可邀约候选人数量');return false}
 const previous=backfillOperations.get(b.id);if(previous?.timer)clearTimeout(previous.timer);
 const operation={status:'sending',slots:[...chosen],candidates:candidates.slice(0,chosen.length),hadPending:b.todos.length>0,message:'',timer:null};
 backfillOperations.set(b.id,operation);
 closeModal();refreshBackfillProgress(b.id);
 await new Promise(resolve=>setTimeout(resolve,1000));
 if(backfillOperations.get(b.id)!==operation)return false;
 const liveBatch=state.batches.find(batch=>batch.id===b.id),eligible=liveBatch?eligibleCandidates(liveBatch):[],available=liveBatch?vacatedSlots(liveBatch).filter(i=>slotStart(liveBatch,i).getTime()-Date.now()>BACKFILL_CUTOFF_HOURS*3600000):[];
 if(liveBatch!==b||b.inTrash||!canBackfill(b,true)||!operation.slots.every(slot=>available.includes(slot))||!operation.candidates.every(candidate=>eligible.includes(candidate))){
  operation.status='error';operation.message='补位条件已变化，请重新选择时段';
  refreshBackfillProgress(b.id);toast(operation.message);scheduleBackfillNoticeClear(b.id,operation);return false;
 }
 const additions=operation.slots.map((slot,index)=>{const candidate=operation.candidates[index],person=[candidate[0],`候补-${b.id}-${slot}`,'未确认',slot];person.poolEnteredAt=candidate[3];return person});
 b.people=b.people.concat(additions);syncBatchCounts(b);selectedBackfillSlots.delete(b.id);
 prependBatchLogs(b,`Agent 按 FIFO 发出 ${additions.length} 人补位邀请，候选人池同步更新`,`HR ${operation.hadPending?'确认':'发起'}补位 ${additions.length} 人`);
 operation.status='complete';operation.message=`已发送 ${additions.length} 位候选人的补位邀请`;
 refreshBackfillProgress(b.id,true);toast(operation.message);scheduleBackfillNoticeClear(b.id,operation);return true;
}
function renderModal(){const root=$('modalRoot');if(!state.modal&&root.dataset.closing==='true')return;const changed=state.renderedModal!==state.modal;delete root.dataset.closing;renderModalContent();state.renderedModal=state.modal;if(changed&&state.modal){enterSurface(root.firstElementChild,'veil');enterSurface(root.querySelector('.modal'),'dialog')}}
function renderModalContent(){let root=$('modalRoot');if(!state.modal){root.innerHTML='';return}if(state.modal==='trash'){root.innerHTML=trashModal();return}if(state.modal.startsWith('person:')){root.innerHTML=personModal();return}if(state.modal==='backfill'){root.innerHTML=backfillModal();return}if(state.modal==='planWarning'){root.innerHTML=`<div class="veil" onclick="if(event.target===this)closeModal()"><section class="modal plan-warning-modal" role="dialog" aria-modal="true" aria-label="已接管批次不可修改排期"><div class="modal-top"><h2>已接管批次不可修改排期</h2><button class="modal-close" onclick="closeModal()">×</button></div><p class="modal-help">Agent 已发出邀请，更改面试计划可能会打乱现有排期。</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">我知道了</button></div></section></div>`;return}if(state.modal==='editPlan'){const b=current();if(b.phase!=='waiting'){state.modal='planWarning';renderModalContent();return}root.innerHTML=`<div class="veil" onclick="if(event.target===this)closeModal()"><section class="modal create-modal edit-plan-modal" role="dialog" aria-modal="true" aria-label="修改面试计划"><div class="modal-top"><div><h2>修改面试计划</h2><div class="muted small">更新面试计划，Agent 将按新的设置执行邀请</div></div><button class="modal-close" aria-label="关闭弹窗" onclick="closeModal()">×</button></div>${createForm(b)}</section></div>`;return}if(state.modal==='create'){root.innerHTML=`<div class="veil" onclick="if(event.target===this)closeModal()"><section class="modal create-modal" role="dialog" aria-modal="true" aria-label="创建面试计划"><div class="modal-top"><div><h2>创建面试计划</h2><div class="muted small">设置面试计划，Agent 将在指定时间执行邀请</div></div><button class="modal-close" aria-label="关闭弹窗" onclick="closeModal()">×</button></div>${createForm()}</section></div>`;return}root.innerHTML=`<div class="veil"><section class="modal"><h2>需要 HR 处理</h2><p class="modal-help">请从候选人名单选择对应候选人，完成状态及改期处理。</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">返回</button></div></section></div>`}
function savePlanEdit(e){
 e.preventDefault();const b=state.batches.find(batch=>String(batch.id)===e.target.dataset.batchId);
 if(!b||b.inTrash){toast('该面试计划已不可修改，请重新打开');return}
 if(b.phase!=='waiting'){state.modal='planWarning';renderModal();return}
 const plan=readInterviewPlanForm(e.target);if(plan.error){toast(plan.error);return}
 Object.assign(b,plan);prependBatchLogs(b,'HR 更新了尚未接管的面试计划');
 if(state.view==='editPlan')returnFromPlanEditPage();else{closeModal();render()}renderPool();toast('面试计划已更新');
}
function replyToCandidate(){let text=$('hrReply').value.trim();if(!text){toast('请输入回复内容');return}let b=current(),id=state.modal;b.todos=b.todos.filter(t=>t[0]!==id);prependBatchLogs(b,'HR 已回复候选人：'+text.slice(0,50));b.notes.unshift('邮件回复发送完成');closeModal();render();toast('回复完成')}
function toast(t){$('toastRoot').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toastRoot').innerHTML='',3000)}
let agentWindowAnimation=null,launcherWindowAnimation=null,agentWindowMotionId=0;
function transitionAgentWindow(opening){
 const agent=$('agent'),launcher=$('launcher'),motionId=++agentWindowMotionId;
 const hidden=agent.classList.contains('hidden'),style=getComputedStyle(agent);
 const start={opacity:hidden?0:Number(style.opacity),transform:hidden?'translateY(12px) scale(.97)':style.transform};
 agentWindowAnimation?.cancel();launcherWindowAnimation?.cancel();
 agent.classList.remove('hidden');launcher.classList.remove('hidden');
 agent.style.pointerEvents=opening?'':'none';launcher.style.pointerEvents=opening?'none':'';
 if(prefersQuietMotion()||typeof agent.animate!=='function'){
  agent.classList.toggle('hidden',!opening);launcher.classList.toggle('hidden',opening);
  agent.style.pointerEvents='';launcher.style.pointerEvents='';return;
 }
 const panel=agent.getBoundingClientRect(),entry=launcher.getBoundingClientRect();
 agent.style.transformOrigin=`${Math.max(0,Math.min(100,(entry.left+entry.width/2-panel.left)/panel.width*100))}% ${Math.max(0,Math.min(100,(entry.top+entry.height/2-panel.top)/panel.height*100))}%`;
 agent.style.willChange='opacity, transform';
 agentWindowAnimation=agent.animate([start,opening?{opacity:1,transform:'translateY(0) scale(1)'}:{opacity:0,transform:'translateY(10px) scale(.97)'}],{duration:opening?320:220,easing:opening?'cubic-bezier(.16,1,.3,1)':'cubic-bezier(.4,0,.7,.3)',fill:'forwards'});
 launcherWindowAnimation=launcher.animate(opening?[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.96)'}]:[{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}],{duration:opening?140:220,delay:opening?0:60,easing:'cubic-bezier(.2,.75,.25,1)',fill:'both'});
 const panelMotion=agentWindowAnimation,entryMotion=launcherWindowAnimation;
 Promise.all([panelMotion.finished,entryMotion.finished]).then(()=>{
  if(motionId!==agentWindowMotionId)return;
  agent.classList.toggle('hidden',!opening);launcher.classList.toggle('hidden',opening);
  panelMotion.cancel();entryMotion.cancel();agentWindowAnimation=null;launcherWindowAnimation=null;
  agent.style.willChange='';agent.style.pointerEvents='';launcher.style.pointerEvents='';
 },()=>{});
}
function openAgent(){state.view='dashboard';state.drawerOpen=false;state.modal=null;render();transitionAgentWindow(true)}
function closeAgent(){state.view='dashboard';closeModal();transitionAgentWindow(false)}
// Pointer-drag the floating window by its header (but not its controls).
function draggable(el,handle){let start=null,moved=false;handle.addEventListener('pointerdown',e=>{if(e.button!==0||(el!==handle&&e.target.closest('button'))||el.classList.contains('max'))return;let r=el.getBoundingClientRect();start={x:e.clientX,y:e.clientY,left:r.left,top:r.top};moved=false;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>4)moved=true;if(!moved)return;el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,start.left+dx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-el.offsetHeight,start.top+dy))+'px';el.style.right='auto';el.style.bottom='auto'});handle.addEventListener('pointerup',()=>{start=null});handle.addEventListener('pointercancel',()=>{start=null});return()=>moved}
draggable($('agent'),$('dragBar'));const launcherMoved=draggable($('launcher'),$('launcher'));$('launcher').addEventListener('click',e=>{if(launcherMoved()){e.stopImmediatePropagation();e.preventDefault()}},true);
document.addEventListener('click',event=>{if(!event.target.closest('.host .pool-filter'))closePoolFilters()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});startPool();render();
